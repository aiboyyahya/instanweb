[phases.setup]
install = "apt-get update && apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev zip git unzip curl libicu-dev libzip-dev && docker-php-ext-configure intl && docker-php-ext-install intl zip pdo_mysql"

[phases.install]
commands = ["composer install --no-dev --optimize-autoloader", "npm install", "node --max-old-space-size=400 ./node_modules/vite/bin/vite.js build"]

[phases.build]
commands = ["php artisan optimize:clear"]

[start]
cmd = "php -S 0.0.0.0:$PORT -t /app/public"