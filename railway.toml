[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader && npm install && npm run build"

[start]
cmd = "php-fpm -F"

[phases.setup]
install = "apt-get update && apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev zip unzip curl git"

[phases.install]
commands = ["composer install --no-dev --optimize-autoloader", "npm ci --only=production"]

[phases.build]
commands = ["npm run build", "php artisan optimize:clear"]

[deploy]
healthcheckPath = "/up"
healthcheckTimeoutSecs = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5